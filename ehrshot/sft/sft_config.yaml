# Supervised Fine-Tuning Configuration for Qwen 8B Model

# Model Configuration
model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  trust_remote_code: true
  use_quantization: true
  max_length: 4096
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  do_sample: true

# LoRA Configuration
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.1
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# Training Configuration
training:
  output_dir: "./qwen_sft_output"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"

# Logging and Evaluation
logging:
  logging_steps: 10
  eval_steps: 100
  save_steps: 500
  evaluation_strategy: "steps"
  save_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  use_wandb: false
  wandb_project: "qwen-sft-ehrshot"

# Other Settings
misc:
  seed: 42
  dataloader_num_workers: 4
  remove_unused_columns: false
  fp16: true
  gradient_checkpointing: true
  save_total_limit: 3

# Dataset Configuration
dataset:
  train_split_ratio: 0.9
  max_examples: null  # null means use all examples
  patient_ids_filter: null  # null means use all patients
